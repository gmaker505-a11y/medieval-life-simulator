name: Game tests and screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run gameplay, responsive-layout and screenshot tests
        run: npm test
      - name: Upload screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medieval-life-visual-checks
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14