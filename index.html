<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211a17">
<meta name="description" content="A choice-driven medieval life simulator. Live a life, shape your legacy.">
<title>Medieval Life — A Life of Your Own</title>
<style>
:root{--ink:#28211c;--muted:#75685b;--paper:#f4ead6;--paper2:#fff8e9;--line:#d7c6a8;--wine:#713b3b;--gold:#c28a38;--green:#526b4b;--shadow:0 12px 35px #130e0b22}
*{box-sizing:border-box}html{background:#211a17}body{margin:0;color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at top,#594332 0,#2b211b 60%,#171310 100%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;padding:16px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#f7ead0;padding:12px 4px 18px}.brand{display:flex;align-items:center;gap:12px}.crest{width:46px;height:52px;display:grid;place-items:center;background:linear-gradient(145deg,#d5ad60,#9c6c2d);clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);font-size:25px;color:#241b13;text-shadow:0 1px #f4d99a}.brand h1{font-size:clamp(21px,4vw,30px);line-height:1;margin:0;letter-spacing:.02em}.brand p{margin:5px 0 0;color:#d6c4a5;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.dark-btn{border:1px solid #88745d;background:#33271f;color:#f5e5c7;border-radius:10px;padding:9px 12px}.dark-btn:hover{background:#493629}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid #b69b72;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.side{padding:17px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:bold}.portrait{background:linear-gradient(160deg,#e3d0a9,#b99b6b);border:1px solid #b29a70;border-radius:12px;min-height:142px;display:grid;place-items:center;text-align:center;margin:10px 0 12px;padding:15px}.portrait .emoji{font-size:48px;line-height:1.1}.portrait strong{display:block;font-size:18px;margin-top:6px}.portrait small{display:block;color:#62503c;margin-top:2px}.stat{margin:12px 0}.stat-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}.track{height:8px;border-radius:10px;background:#d8c9b0;overflow:hidden}.fill{height:100%;width:50%;border-radius:10px;background:var(--green);transition:width .25s}.fill.health{background:#8c4940}.fill.happiness{background:#b78a39}.fill.reputation{background:#78618a}.money{font-size:25px;font-weight:bold;color:#35563a;margin:4px 0}.side-divider{height:1px;background:var(--line);margin:16px 0}.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:10px 11px;border-radius:9px;color:var(--ink);display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:#e6d8bd;border-color:#d1bd97}.nav .nav-icon{width:22px;text-align:center;font-size:17px}.main{min-width:0}.yearbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;background:#e5d4b4;border-bottom:1px solid var(--line)}.yearbar strong{font-size:17px}.yearbar span{color:#65513c;font-size:13px}.content{padding:clamp(15px,3vw,25px)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:var(--wine);font-weight:bold}.page-title{font-size:clamp(25px,4vw,34px);line-height:1.1;margin:5px 0 8px}.subtle{color:var(--muted)}.hero{border-radius:12px;background:linear-gradient(120deg,#3e3025,#6d4c30);color:#fff1d5;padding:22px;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"✦";position:absolute;right:22px;top:4px;font-size:95px;color:#f5d7a022}.hero h2{font-size:25px;margin:0 0 7px;position:relative;z-index:1}.hero p{max-width:560px;color:#e7d5b9;margin:0;position:relative;z-index:1}.hero .hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;position:relative;z-index:1}.chip{display:inline-flex;align-items:center;gap:5px;background:#ffffff19;border:1px solid #ffffff2b;border-radius:20px;padding:5px 9px;font-size:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini-card{background:var(--paper2);border:1px solid var(--line);border-radius:11px;padding:15px;min-width:0}.mini-card h3{margin:0 0 5px;font-size:16px}.mini-card p{margin:0;color:var(--muted);font-size:13px}.card-icon{font-size:23px;margin-bottom:6px}.event-card{background:var(--paper2);border:1px solid #cbb38d;border-radius:13px;padding:19px;margin:15px 0}.event-card h2{font-size:23px;margin:5px 0 8px}.choices{display:grid;gap:9px;margin-top:15px}.choice{width:100%;text-align:left;display:flex;align-items:flex-start;gap:11px;padding:13px;background:#fff9ed;border:1px solid #cdbb9d;border-radius:10px;color:var(--ink);transition:transform .12s,border-color .12s}.choice:hover{border-color:#9d7743;transform:translateY(-1px)}.choice .choice-icon{font-size:20px}.choice strong{display:block;margin-bottom:2px}.choice small{display:block;color:var(--muted);font-size:12px}.primary{border:1px solid #5d302f;background:var(--wine);color:#fff4df;border-radius:10px;padding:12px 16px;font-weight:bold}.primary:hover{background:#874949}.secondary{border:1px solid #c6b18c;background:#f9efd9;color:var(--ink);border-radius:10px;padding:10px 13px}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.timeline{border-left:2px solid #c4ad85;margin:17px 0 0 6px;padding-left:17px}.entry{position:relative;padding:0 0 17px}.entry:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;background:var(--gold);border:2px solid var(--paper);border-radius:50%}.entry strong{font-size:14px}.entry p{margin:3px 0 0;color:var(--muted);font-size:13px}.badge{display:inline-block;border-radius:5px;background:#e5d7bd;color:#665039;padding:3px 7px;font-size:11px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #c8b591;border-radius:8px;background:#fff9ed;color:var(--ink)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#241d17;color:#fff0d2;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:10;text-align:center}.footer{text-align:center;color:#b9a58b;font-size:12px;padding:18px 0 8px}.hidden{display:none!important}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row p{margin:3px 0 0;color:var(--muted);font-size:12px}.list-row .value{font-weight:bold;text-align:right;white-space:nowrap}.notice{border-left:3px solid var(--gold);padding:10px 12px;background:#ecdfc6;border-radius:0 8px 8px 0;font-size:13px;margin:12px 0}
@media(max-width:720px){.app{padding:10px}.masthead{align-items:flex-start}.brand p{font-size:10px}.crest{width:39px;height:45px}.top-actions{justify-content:flex-end}.top-actions .dark-btn{font-size:12px;padding:8px}.layout{grid-template-columns:1fr;gap:10px}.side{padding:13px}.side-top{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:center}.portrait{min-height:100px;margin:0;padding:8px}.portrait .emoji{font-size:34px}.portrait strong{font-size:14px}.portrait small{font-size:11px}.side-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.money{font-size:21px}.side-divider{margin:12px 0}.nav{display:flex;overflow-x:auto;gap:5px;padding-bottom:2px}.nav button{width:auto;white-space:nowrap;flex:0 0 auto;padding:9px 11px;font-size:12px}.nav .nav-icon{width:auto}.nav button span:last-child{display:inline}.yearbar{padding:12px 14px}.content{padding:15px}.hero{padding:18px}.grid2{grid-template-columns:1fr 1fr}.mini-card{padding:12px}.mini-card h3{font-size:14px}.mini-card p{font-size:12px}.event-card{padding:15px}.form-grid{gap:10px}.footer{padding-bottom:16px}}
@media(max-width:390px){.brand h1{font-size:20px}.top-actions{max-width:120px}.grid2{grid-template-columns:1fr}.side-stats{grid-template-columns:1fr 1fr}.yearbar{align-items:flex-start;flex-direction:column;gap:3px}}
</style>
</head>
<body>
<div class="app">
<header class="masthead"><div class="brand"><div class="crest">♜</div><div><h1>Medieval Life</h1><p>A life of your own</p></div></div><div class="top-actions"><button class="dark-btn" id="saveBtn" type="button">↥ Save</button><button class="dark-btn" id="exportSaveBtn" type="button">⇩ Export save</button><button class="dark-btn" id="importSaveBtn" type="button">⇧ Import save</button><button class="dark-btn" id="restoreBackupBtn" type="button">↶ Restore backup</button><button class="dark-btn" id="newLifeBtn" type="button">＋ New life</button><input id="importSaveFile" type="file" accept=".json,application/json" hidden></div></header>
<div class="layout">
<aside class="panel side">
<div class="side-top"><div class="portrait"><div><div class="emoji" id="portraitEmoji">👶</div><strong id="sideName">Your story</strong><small id="sideStatus">Awaiting your birth</small></div></div><div><div class="section-label">Your purse</div><div class="money" id="money">0 coins</div><div class="subtle" id="occupation">No occupation yet</div><div class="badge" id="rankBadge">Commoner</div></div></div>
<div class="side-divider"></div><div class="side-stats" id="stats"></div>
<div class="side-divider"></div><div class="section-label" style="margin-bottom:8px">Your life</div>
<nav class="nav" aria-label="Game sections">
<button class="active" data-page="life"><span class="nav-icon">📜</span><span>Life</span></button><button data-page="character"><span class="nav-icon">🧬</span><span>Character</span></button><button data-page="career"><span class="nav-icon">⚒️</span><span>Career</span></button><button data-page="relationships"><span class="nav-icon">♥</span><span>People</span></button><button data-page="wealth"><span class="nav-icon">🪙</span><span>Wealth</span></button><button data-page="history"><span class="nav-icon">📖</span><span>Biography</span></button>
</nav>
</aside>
<main class="panel main"><div class="yearbar"><strong id="yearLabel">Year 1000 · Age 0</strong><span id="seasonLabel">Spring · England</span></div><div class="content" id="pageContent" aria-live="polite"></div></main>
</div>
<div class="footer">A little life, a thousand possible stories. · Your progress saves on this device.</div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
'use strict';
const KEY='medieval-life-save-v1';
const BACKUP_KEY=KEY+'-backup';
const SAVE_VERSION=2;
const $=id=>document.getElementById(id);
const seasons=['Spring','Summer','Autumn','Winter'];
const careers={
'Farmhand':{pay:8,skill:'craft',desc:'Work the fields and learn the rhythm of the seasons.'},
'Apprentice Blacksmith':{pay:10,skill:'craft',desc:'Learn a trade beside a village smith.'},
'Baker':{pay:11,skill:'craft',desc:'Rise before dawn to feed the village.'},
'Merchant':{pay:18,skill:'charm',desc:'Buy and sell goods, if you can afford the risk.'},
'Guard':{pay:15,skill:'combat',desc:'Keep the peace at gates and market squares.'},
'Soldier':{pay:17,skill:'combat',desc:'Serve a lord and face the dangers of war.'},
'Healer':{pay:16,skill:'intellect',desc:'Study herbs, wounds and old remedies.'},
'Scribe':{pay:14,skill:'intellect',desc:'Read, write and keep important records.'},
'Priest':{pay:13,skill:'faith',desc:'Serve your community and the church.'},
'Thief':{pay:20,skill:'stealth',desc:'Take what you can, and hope nobody sees.'},
'Knight':{pay:32,skill:'combat',desc:'A title, fine equipment and dangerous duties.'},
'Noble Steward':{pay:35,skill:'charm',desc:'Manage an estate and earn a lord’s trust.'},
'Royal Adviser':{pay:55,skill:'intellect',desc:'Whisper counsel where kingdoms are shaped.'},
'Lord / Lady':{pay:60,skill:'charm',desc:'Rule an estate, collect rents and manage obligations.'}
};
const events=[
{title:'A travelling peddler',text:'A peddler arrives with bright ribbons, curious trinkets and rumours from distant roads.',choices:[['🪙','Trade a few coins for a useful tool','money',-8,'The tool may serve you well.'],['👂','Listen to the rumours','intellect',2,'You learn something useful about the wider world.'],['🚶','Move along','happiness',1,'You spend the afternoon in peace.']]},
{title:'A village feast',text:'The harvest is in, and the village gathers around a long table beneath lanterns.',choices:[['🍲','Join the feast','happiness',9,'Good food and company lift your spirits.'],['🤝','Make useful connections','reputation',5,'A few villagers remember your kindness.'],['💰','Sell food and drink','money',12,'You turn the crowd into a tidy profit.']]},
{title:'A difficult neighbour',text:'A neighbour claims your family owes them a debt. The whole lane is watching.',choices:[['🗣️','Talk it out calmly','charm',3,'A calm conversation keeps the dispute from growing.'],['⚔️','Threaten to settle it by force','health',-7,'The argument becomes a scuffle.'],['🪙','Pay a small settlement','money',-10,'The neighbour leaves, though the cost stings.']]},
{title:'A letter from the lord',text:'A sealed letter calls for able hands at the manor. It could be an opportunity—or trouble.',choices:[['🏰','Offer your service','reputation',6,'The steward takes note of your willingness.'],['📜','Ask what the work involves','intellect',2,'You learn the details before committing.'],['🙈','Stay out of it','happiness',-1,'You avoid the risk, but wonder what might have been.']]},
{title:'A sick villager',text:'A family nearby is struggling with a fever. They ask whether you can help.',choices:[['🫶','Help them with what you can','reputation',8,'The family will remember your generosity.'],['🧪','Search for herbs','intellect',3,'You learn about a useful local remedy.'],['🚪','Keep your distance','health',1,'You avoid exposure, though some neighbours judge you.']]},
{title:'A tempting shortcut',text:'You spot an unattended purse near the market well. Nobody seems to have noticed it.',choices:[['🪙','Take it quietly','money',18,'The coins are useful, but you feel eyes on your back.'],['📣','Find its owner','reputation',9,'The grateful owner speaks well of you.'],['🚶','Leave it alone','happiness',2,'You walk away with a clear conscience.']]},
{title:'A hard winter',text:'The cold settles in early. Wood is scarce, food costs more and everyone is anxious.',choices:[['🪵','Spend savings on supplies','money',-12,'Your stores should see you through.'],['🤝','Share resources with neighbours','reputation',7,'The village grows closer in a difficult season.'],['🥶','Make do with little','health',-6,'You get through the worst of it, but the cold takes its toll.']]},
{title:'A chance to learn',text:'A travelling scholar offers lessons in exchange for help with their luggage.',choices:[['📚','Take the lessons','intellect',8,'You gain knowledge that may open new doors.'],['💪','Ask for physical training instead','health',5,'The scholar introduces you to a retired soldier.'],['💼','Ask about paid work','money',8,'You earn a little coin carrying books and supplies.']]},
{title:'A public tournament',text:'The lord hosts a tournament. Crowds cheer, wagers fly and reputations can change overnight.',choices:[['🛡️','Enter the contest','health',-4,'You leave bruised, but people admire your courage.'],['🎲','Place a small wager','money',8,'A lucky guess brings a modest return.'],['👀','Watch and make introductions','reputation',5,'You meet people who may prove useful.']]},
{title:'A rumour of war',text:'Riders bring word that neighbouring lords are gathering their forces.',choices:[['⚔️','Volunteer for service','reputation',8,'Your willingness to serve earns notice.'],['🌾','Secure food and supplies','money',-7,'You prepare your household for uncertain times.'],['🕊️','Encourage peace','happiness',3,'You do what you can to keep fear from spreading.']]},
{title:'An unexpected inheritance',text:'A distant relative has died and left a small sum to your family.',choices:[['🏠','Invest in your home','money',-10,'Your home becomes a little more secure.'],['🪙','Keep every coin','money',22,'The unexpected money strengthens your purse.'],['🍞','Share with those in need','reputation',10,'Your generosity earns lasting goodwill.']]},
{title:'A private invitation',text:'Someone influential invites you to a private supper. A new alliance may be possible.',choices:[['🍷','Attend and be charming','reputation',7,'You leave with a promising new connection.'],['🎁','Bring a thoughtful gift','money',-6,'The gesture is well received.'],['🛏️','Decline and rest','health',4,'A quiet evening does you good.']]}
];
let game=null,activePage='life',pendingEvent=null;
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2300)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function addLog(title,text,tag='Life'){game.log.unshift({age:game.age,title,text,tag,year:game.year});if(game.log.length>120)game.log.pop()}
function fresh(name,origin,trait){
return {name:name||'Alden',age:0,year:1000,origin:origin||'Peasant family',trait:trait||'Kind-hearted',health:90,happiness:75,intellect:45,charm:40,combat:25,craft:35,stealth:20,faith:40,reputation:10,money:origin==='Noble household'?90:origin==='Merchant family'?45:origin==='Royal blood'?250:12,career:'Unemployed',rank:origin==='Royal blood'?'Royal blood':origin==='Noble household'?'Noble':'Commoner',partner:null,children:0,house:false,business:null,skills:{},alive:true,log:[],assets:[],lastAction:'Your story begins.',eventCount:0};
}
function validSaveData(s){
return !!s&&typeof s==='object'&&!Array.isArray(s)&&typeof s.name==='string'&&s.name.trim().length>0&&Number.isFinite(Number(s.age))&&Number(s.age)>=0&&Number(s.age)<=130&&Number.isFinite(Number(s.year))&&Number(s.year)>=1&&typeof s.alive==='boolean'&&Array.isArray(s.log)&&Number.isFinite(Number(s.money));
}
function normaliseSaveData(s){
const base=fresh(s.name,s.origin,s.trait);
const clean={...base,...s};
clean.name=String(clean.name).trim().slice(0,24)||'Rowan';
clean.age=Math.max(0,Math.min(130,Math.floor(Number(clean.age)||0)));
clean.year=Math.max(1,Math.floor(Number(clean.year)||1000));
clean.money=Math.max(0,Number.isFinite(Number(clean.money))?Number(clean.money):0);
clean.log=Array.isArray(clean.log)?clean.log.filter(e=>e&&typeof e==='object').slice(0,120):[];
clean.assets=Array.isArray(clean.assets)?clean.assets:[];
clean.skills=clean.skills&&typeof clean.skills==='object'&&!Array.isArray(clean.skills)?clean.skills:{};
clean.children=Math.max(0,Math.floor(Number(clean.children)||0));
for(const k of ['health','happiness','intellect','charm','combat','craft','stealth','faith','reputation'])clean[k]=clamp(Number.isFinite(Number(clean[k]))?Number(clean[k]):base[k]);
clean.version=SAVE_VERSION;
return clean;
}
function parseStoredSave(key){try{const raw=localStorage.getItem(key);if(!raw)return null;const parsed=JSON.parse(raw);const data=parsed&&parsed.game?parsed.game:parsed;return validSaveData(data)?normaliseSaveData(data):null}catch(e){return null}}
function save(silent=false){
if(!game){if(!silent)toast('Start a life first.');return false}
try{
const previous=parseStoredSave(KEY);
if(previous)localStorage.setItem(BACKUP_KEY,JSON.stringify({version:SAVE_VERSION,savedAt:new Date().toISOString(),game:previous}));
const payload={version:SAVE_VERSION,savedAt:new Date().toISOString(),game:normaliseSaveData(game)};
localStorage.setItem(KEY,JSON.stringify(payload));game=payload.game;
if(!silent)toast('Saved safely on this device. A previous version is kept as backup.');
return true;
}catch(e){if(!silent)toast('Could not save. Browser storage may be full or disabled.');return false}
}
function load(){
const primary=parseStoredSave(KEY);
if(primary){game=primary;return true}
const backup=parseStoredSave(BACKUP_KEY);
if(backup){game=backup;try{localStorage.setItem(KEY,JSON.stringify({version:SAVE_VERSION,savedAt:new Date().toISOString(),game:backup}))}catch(e){};setTimeout(()=>toast('Recovered your life from the backup save.'),0);return true}
return false
}
function restoreBackup(){
const backup=parseStoredSave(BACKUP_KEY);
if(!backup){toast('No valid backup is available yet. Save your life and try again.');return}
game=backup;pendingEvent=null;activePage='life';
try{localStorage.setItem(KEY,JSON.stringify({version:SAVE_VERSION,savedAt:new Date().toISOString(),game:backup}))}catch(e){toast('Backup restored in memory, but browser storage is unavailable.')}
render();toast('Backup restored. Your earlier progress is back.')
}
function downloadJSON(filename,data){
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportSave(){
if(!game){toast('Start a life first.');return}
downloadJSON((game.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'life')+'-medieval-life-save.json',{format:'medieval-life-save',version:SAVE_VERSION,exportedAt:new Date().toISOString(),game:normaliseSaveData(game)});
toast('Save file exported. Keep it somewhere safe.')
}
function importSaveData(parsed){
const data=parsed&&parsed.game?parsed.game:parsed;
if(!validSaveData(data)){toast('That file is not a valid Medieval Life save. Nothing was changed.');return false}
if(game&&!confirm('Import this life and replace the current one? Your current save will remain available as a backup.'))return false;
game=normaliseSaveData(data);pendingEvent=null;activePage='life';save(true);render();toast('Life imported successfully.');return true
}
function importSaveFile(file){
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{try{importSaveData(JSON.parse(String(reader.result||'')))}catch(e){toast('Could not read that save file. Nothing was changed.')}};
reader.onerror=()=>toast('Could not read that file. Try another copy.');
reader.readAsText(file);
}
function stat(label,key,cls){let v=clamp(game[key]);return '<div class="stat"><div class="stat-top"><span>'+label+'</span><strong>'+v+'</strong></div><div class="track"><div class="fill '+(cls||'')+'" style="width:'+v+'%"></div></div></div>'}
function updateShell(){
if(!game)return;
$('sideName').textContent=game.name;$('sideStatus').textContent=game.alive?'Age '+game.age+' · '+game.trait:'Life ended at age '+game.age;
$('portraitEmoji').textContent=!game.alive?'🪦':game.age<3?'👶':game.age<13?'🧒':game.age<20?'🧑':game.age<55?'🧔':'👴';
$('money').textContent=game.money.toLocaleString()+' coins';$('occupation').textContent=game.career;$('rankBadge').textContent=game.rank;
$('yearLabel').textContent='Year '+game.year+' · Age '+game.age;$('seasonLabel').textContent=seasons[(game.age+game.year)%4]+' · England';
$('stats').innerHTML=stat('Health','health','health')+stat('Happiness','happiness','happiness')+stat('Intelligence','intellect')+stat('Charm','charm')+stat('Reputation','reputation','reputation');
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));
}
function render(){
updateShell();const c=$('pageContent');if(!game){c.innerHTML=startScreen();return}
if(!game.alive && activePage==='life'){c.innerHTML=deathScreen();return}
const pages={life:lifePage,character:characterPage,career:careerPage,relationships:relationshipsPage,wealth:wealthPage,history:historyPage};
c.innerHTML=(pages[activePage]||lifePage)();
}
function startScreen(){return '<div class="hero"><div class="eyebrow" style="color:#e5bd75">Your story awaits</div><h2>Who will you become?</h2><p>From a humble village to the royal court, every year brings a new choice. Make a life, build a legacy, and see where your decisions lead.</p><div class="hero-meta"><span class="chip">📜 Choice-driven life</span><span class="chip">👑 Medieval England</span><span class="chip">💾 Local saving</span></div></div><h2 class="page-title">Begin a new life</h2><p class="subtle">Choose your beginnings. Your circumstances shape your first opportunities, but they do not decide your whole future.</p><div class="form-grid"><div class="field"><label for="newName">Character name</label><input id="newName" maxlength="24" placeholder="e.g. Rowan" value="Rowan"></div><div class="field"><label for="newOrigin">Family background</label><select id="newOrigin"><option>Peasant family</option><option>Merchant family</option><option>Noble household</option><option>Royal blood</option></select></div><div class="field"><label for="newTrait">Personality</label><select id="newTrait"><option>Kind-hearted</option><option>Ambitious</option><option>Cunning</option><option>Brave</option><option>Curious</option><option>Charming</option></select></div></div><button class="primary" id="startBtn">✦ Begin your life</button>'}
function lifePage(){
if(pendingEvent)return eventHTML(pendingEvent);
const intro=game.age===0?'You have been born into a '+game.origin.toLowerCase()+'. Your story starts here.':game.lastAction||'Another year of your life lies ahead.';
let cards='<div class="grid2"><div class="mini-card"><div class="card-icon">🏡</div><h3>Home & family</h3><p>'+(game.house?'You own a modest home.':'You have no property of your own yet.')+' '+(game.partner?'Your partner is '+esc(game.partner)+'.':'You are currently unmarried.')+'</p></div><div class="mini-card"><div class="card-icon">🛠️</div><h3>Work & purpose</h3><p>'+esc(game.career)+'. '+(game.career==='Unemployed'?'Find work to earn a living.':'Earn about '+(careers[game.career]?.pay||10)+' coins each year.')+'</p></div></div>';
return '<div class="hero"><div class="eyebrow" style="color:#e5bd75">Year '+game.year+' · Age '+game.age+'</div><h2>'+(game.age<13?'A childhood takes shape':game.age<20?'The road to adulthood':game.age<50?'The making of a life':'The later years')+'</h2><p>'+esc(intro)+'</p><div class="hero-meta"><span class="chip">🪙 '+game.money+' coins</span><span class="chip">♥ '+game.children+' children</span><span class="chip">✦ '+esc(game.rank)+'</span></div></div><h2 class="page-title">What will you do?</h2><p class="subtle">Choose an action, or advance a year to discover what fate has in store.</p><div class="choices">'+actionChoices()+'</div>'+cards+'<div class="button-row"><button class="primary" id="ageBtn">⏳ Live another year</button><button class="secondary" id="restBtn">🛏️ Rest and recover</button><button class="secondary" id="studyBtn">📚 Study a skill</button></div>';
}
function actionChoices(){
if(game.age<6)return choice('🧸','Spend time with family','Build happiness and feel safe.','action','family')+choice('🌿','Explore the garden','A small adventure close to home.','action','explore');
if(game.age<13)return choice('📚','Learn to read','Improve intelligence and open future doors.','action','study')+choice('🧹','Help with chores','Learn useful skills and earn goodwill.','action','chores')+choice('🧒','Make a friend','Start building your social life.','action','friend');
if(game.age<16)return choice('📚','Study with the village scribe','Build intelligence.','action','study')+choice('⚒️','Seek an apprenticeship','Start learning a trade.','action','apprentice')+choice('🏹','Train your body','Build strength and resilience.','action','train');
return choice('⚒️','Look for work','Find a job that fits your life.','page','career')+choice('🤝','Meet people','Make friends or find romance.','action','social')+choice('🪙','Try to earn extra coin','Take a small risk for a little money.','action','oddjob')+choice('🕵️','Try a risky scheme','Potential reward, with consequences.','action','scheme');
}
function choice(icon,title,desc,type,value){return '<button class="choice" data-choice-type="'+type+'" data-choice="'+value+'"><span class="choice-icon">'+icon+'</span><span><strong>'+title+'</strong><small>'+desc+'</small></span></button>'}
function eventHTML(ev){return '<div class="eyebrow">A year in your life</div><div class="event-card"><div style="font-size:33px">✦</div><h2>'+esc(ev.title)+'</h2><p>'+esc(ev.text)+'</p><p class="subtle">Your decision may change more than this moment.</p><div class="choices">'+ev.choices.map((ch,i)=>'<button class="choice" data-event-choice="'+i+'"><span class="choice-icon">'+ch[0]+'</span><span><strong>'+esc(ch[1])+'</strong><small>'+esc(ch[4])+'</small></span></button>').join('')+'</div></div>'}
function characterPage(){return '<div class="eyebrow">Who you are</div><h2 class="page-title">Character & abilities</h2><p class="subtle">Your strengths can grow through the choices you make.</p><div class="grid2">'+[['Intelligence','intellect','📚'],['Charm','charm','🗣️'],['Combat','combat','⚔️'],['Craftsmanship','craft','⚒️'],['Stealth','stealth','🗝️'],['Faith','faith','🕯️']].map(a=>'<div class="mini-card"><div class="card-icon">'+a[2]+'</div><h3>'+a[0]+'</h3><div class="track"><div class="fill" style="width:'+clamp(game[a[1]])+'%"></div></div><p>'+clamp(game[a[1]])+' / 100</p></div>').join('')+'</div><div class="notice">Personality: <strong>'+esc(game.trait)+'</strong>. Background: <strong>'+esc(game.origin)+'</strong>. Some choices are easier for people with the right skills or reputation.</div><div class="list-row"><div><strong>Age</strong><p>Years lived so far</p></div><span class="value">'+game.age+'</span></div><div class="list-row"><div><strong>Life events</strong><p>Recorded moments in your biography</p></div><span class="value">'+game.log.length+'</span></div>'}
function careerPage(){return '<div class="eyebrow">Work & ambition</div><h2 class="page-title">Choose your path</h2><p class="subtle">Some roles require age, skill, money or reputation. Your current work: <strong>'+esc(game.career)+'</strong>.</p>'+Object.entries(careers).map(([name,job])=>{let locked=game.age<13||(name==='Knight'&&game.age<18)||(name==='Royal Adviser'&&game.reputation<45)||(name==='Lord / Lady'&&game.reputation<35)||(name==='Noble Steward'&&game.reputation<20);let reason=game.age<13?'Too young':name==='Royal Adviser'&&game.reputation<45?'Needs 45 reputation':name==='Lord / Lady'&&game.reputation<35?'Needs 35 reputation':name==='Noble Steward'&&game.reputation<20?'Needs 20 reputation':'Available';return '<div class="list-row"><div><strong>'+esc(name)+'</strong><p>'+esc(job.desc)+'</p><span class="badge">'+reason+'</span></div><div class="value">+'+job.pay+' / yr<br><button class="secondary" style="margin-top:6px;padding:6px 9px" data-job="'+esc(name)+'" '+(locked?'disabled':'')+'>'+(game.career===name?'Current':'Apply')+'</button></div></div>'}).join('')+'<div class="button-row"><button class="secondary" data-choice-type="action" data-choice="quit">Leave your current job</button></div>'}
function relationshipsPage(){return '<div class="eyebrow">The people around you</div><h2 class="page-title">Relationships & family</h2><p class="subtle">Relationships need attention. Kindness, time and honesty can build lasting bonds.</p><div class="grid2"><div class="mini-card"><div class="card-icon">♥</div><h3>Romance</h3><p>'+(game.partner?'You are married to or partnered with '+esc(game.partner)+'.':'You have no partner at present.')+'</p><div class="button-row"><button class="primary" id="romanceBtn" '+(game.age<16||game.partner?'disabled':'')+'>'+(game.partner?'Strengthen bond':'Seek romance')+'</button></div></div><div class="mini-card"><div class="card-icon">🧒</div><h3>Children</h3><p>'+game.children+' child'+(game.children===1?'':'ren')+'. Your family may continue your legacy.</p><div class="button-row"><button class="secondary" id="childBtn" '+(game.age<18||!game.partner||game.children>=8?'disabled':'')+'>Grow your family</button></div></div></div><div class="list-row"><div><strong>Reputation</strong><p>How the wider community sees you</p></div><span class="value">'+game.reputation+'/100</span></div><div class="list-row"><div><strong>Social life</strong><p>Meet neighbours and build connections</p></div><button class="secondary" data-choice-type="action" data-choice="social">Meet someone</button></div><div class="notice">Your choices affect how others see you. A good name can open doors; a bad one can close them.</div>'}
function wealthPage(){return '<div class="eyebrow">Coins, land & possessions</div><h2 class="page-title">Your wealth</h2><p class="subtle">Money buys comfort and opportunity, but it can disappear quickly in a hard year.</p><div class="hero"><div class="eyebrow" style="color:#e5bd75">Available funds</div><h2>'+game.money.toLocaleString()+' silver coins</h2><p>Annual income: '+(careers[game.career]?.pay||0)+' coins '+(game.business?' · plus your business':'')+'</p></div><div class="choices">'+choice('🏠','Buy a modest home','Costs 100 coins. Improves security and happiness.','action','house')+choice('🛒','Start a small business','Costs 60 coins. Earn extra income each year.','action','business')+choice('🌾','Buy land','Costs 150 coins and improves your standing.','action','land')+choice('🎁','Give alms','Give 10 coins to improve your reputation.','action','alms')+'</div><div class="list-row"><div><strong>Property</strong><p>'+(game.house?'A modest home':'No home owned')+'</p></div><span class="value">'+(game.house?'Owned':'—')+'</span></div><div class="list-row"><div><strong>Business</strong><p>'+esc(game.business||'No business yet')+'</p></div><span class="value">'+(game.business?'Active':'—')+'</span></div><div class="list-row"><div><strong>Land</strong><p>'+(game.assets.includes('Land')?'A small holding':'No land owned')+'</p></div><span class="value">'+(game.assets.includes('Land')?'Owned':'—')+'</span></div>'}
function historyPage(){return '<div class="eyebrow">Your recorded story</div><h2 class="page-title">Biography</h2><p class="subtle">Every meaningful choice becomes part of your history.</p>'+(game.log.length?'<div class="timeline">'+game.log.map(e=>'<div class="entry"><strong>Age '+e.age+' · '+esc(e.title)+'</strong><p>'+esc(e.text)+'</p><span class="badge">'+esc(e.tag)+'</span></div>').join('')+'</div>':'<div class="empty">Your biography is still blank. Live a little, and your story will begin to fill these pages.</div>')+'<div class="button-row"><button class="secondary" id="exportBtn">Export biography</button></div>'}
function deathScreen(){return '<div class="hero"><div class="eyebrow" style="color:#e5bd75">The end of a life</div><h2>'+esc(game.name)+', remembered</h2><p>Your life has ended at age '+game.age+'. You leave behind '+game.children+' children, '+game.money+' coins, and a story all your own.</p></div><h2 class="page-title">What remains?</h2><div class="grid2"><div class="mini-card"><h3>Final standing</h3><p>'+esc(game.rank)+' · '+esc(game.career)+'</p></div><div class="mini-card"><h3>Life events</h3><p>'+game.log.length+' moments recorded.</p></div></div><div class="button-row"><button class="primary" id="newAfterDeath">Begin another life</button><button class="secondary" id="exportBtn">Export biography</button></div>'}
function applyAction(action){
let msg='';
switch(action){
case'family':game.happiness=clamp(game.happiness+5);msg='A little time with family makes the world feel safer.';break;
case'explore':game.happiness=clamp(game.happiness+3);game.intellect=clamp(game.intellect+1);msg='You find something new in a familiar place.';break;
case'study':game.intellect=clamp(game.intellect+5);game.happiness=clamp(game.happiness-1);msg='You spend time learning, and your mind grows sharper.';break;
case'chores':game.craft=clamp(game.craft+4);game.reputation=clamp(game.reputation+2);msg='Your family appreciates the help.';break;
case'friend':game.charm=clamp(game.charm+3);game.happiness=clamp(game.happiness+4);msg='A new friendship makes the days brighter.';break;
case'apprentice':if(game.age>=12){game.career='Apprentice Blacksmith';msg='A village smith agrees to teach you.'}else msg='You are too young for an apprenticeship.';break;
case'train':game.combat=clamp(game.combat+4);game.health=clamp(game.health+2);msg='Practice leaves you stronger.';break;
case'social':game.charm=clamp(game.charm+3);game.happiness=clamp(game.happiness+3);game.reputation=clamp(game.reputation+1);msg='You spend time among your neighbours and make connections.';break;
case'oddjob':game.money+=Math.floor(Math.random()*9)+4;game.craft=clamp(game.craft+1);msg='A day of odd jobs brings a few coins.';break;
case'scheme':if(Math.random()<.55){game.money+=22;game.reputation=clamp(game.reputation-8);msg='Your risky scheme pays off, but whispers follow you.'}else{game.money=Math.max(0,game.money-8);game.reputation=clamp(game.reputation-10);msg='The scheme goes wrong. You lose time, coin and trust.'}break;
case'quit':game.career='Unemployed';msg='You leave your job to seek another path.';break;
case'house':if(game.house)msg='You already own a home.';else if(game.money<100)msg='You need 100 coins to buy a home.';else{game.money-=100;game.house=true;game.happiness=clamp(game.happiness+8);game.rank=game.reputation>40?'Landed Commoner':game.rank;msg='You buy a modest home. For the first time, the roof is truly yours.'}break;
case'business':if(game.business)msg='You already run a business.';else if(game.money<60)msg='You need 60 coins to start a business.';else{game.money-=60;game.business='Village stall';msg='You open a small village stall. It will bring extra income in good years.'}break;
case'land':if(game.assets.includes('Land'))msg='You already own land.';else if(game.money<150)msg='You need 150 coins to buy land.';else{game.money-=150;game.assets.push('Land');game.reputation=clamp(game.reputation+8);game.rank='Landholder';msg='You purchase a small holding and become a landholder.'}break;
case'alms':if(game.money<10)msg='You do not have 10 coins to give.';else{game.money-=10;game.reputation=clamp(game.reputation+7);game.happiness=clamp(game.happiness+2);msg='You give alms to those in need. People notice.'}break;
default:msg='The day passes quietly.';
}
game.lastAction=msg;addLog(actionLabel(action),msg,'Choice');save(true);toast(msg);render();
}
function actionLabel(a){return ({family:'Family time',explore:'A small adventure',study:'Studying',chores:'Helping at home',friend:'A new friendship',apprentice:'Apprenticeship',train:'Training',social:'Social life',oddjob:'Odd jobs',scheme:'A risky scheme',quit:'Leaving a job',house:'Bought a home',business:'Started a business',land:'Bought land',alms:'Gave alms'})[a]||'A choice'}
function advanceYear(){
if(!game.alive)return;
game.age++;game.year++;game.health=clamp(game.health-(game.age>65?4:game.age>45?2:1));game.happiness=clamp(game.happiness-1);
if(careers[game.career])game.money+=careers[game.career].pay;
if(game.business)game.money+=Math.floor(Math.random()*13)+5;
if(game.house)game.happiness=clamp(game.happiness+1);
if(game.age===13)addLog('Coming of age','You are old enough to begin thinking seriously about work and your future.','Milestone');
if(game.age===16)addLog('A new chapter','You are entering adulthood, with more choices and greater responsibilities.','Milestone');
if(game.age===18)addLog('An adult in the village','You are now considered an adult. The choices you make will shape your reputation.','Milestone');
if(game.age===50)addLog('A life well travelled','You look back on decades of choices, both wise and foolish.','Milestone');
if(game.age>78&&Math.random()<Math.min(.28,.06+(game.age-78)*.018)||game.health<=0){game.alive=false;pendingEvent=null;addLog('The end','Your life comes to an end. The people and choices you leave behind become your legacy.','Ending');save(true);activePage='life';render();return}
let ev=rand(events);pendingEvent=JSON.parse(JSON.stringify(ev));game.eventCount++;game.lastAction='A new year brings an unexpected turn.';save(true);render();
}
function eventChoice(i){if(!pendingEvent)return;const ch=pendingEvent.choices[i];if(!ch)return;const [icon,label,statKey,delta,result]=ch;
if(statKey==='money')game.money=Math.max(0,game.money+delta);else game[statKey]=clamp((game[statKey]||0)+delta);
if(pendingEvent.title==='A tempting shortcut'&&i===0)game.reputation=clamp(game.reputation-5);
game.lastAction=result;addLog(pendingEvent.title,label+': '+result,'Event');pendingEvent=null;save(true);render()}
function startLife(){const name=($('newName')?.value||'Rowan').trim().slice(0,24)||'Rowan';const origin=$('newOrigin')?.value||'Peasant family';const trait=$('newTrait')?.value||'Kind-hearted';game=fresh(name,origin,trait);if(origin==='Merchant family')game.charm=50;if(origin==='Noble household'){game.reputation=25;game.intellect=52}if(origin==='Royal blood'){game.reputation=55;game.charm=55;game.intellect=58}if(trait==='Ambitious')game.intellect+=8;if(trait==='Cunning')game.stealth+=12;if(trait==='Brave')game.combat+=12;if(trait==='Curious')game.intellect+=7;if(trait==='Charming')game.charm+=12;addLog('Born into the world','You were born into a '+origin.toLowerCase()+'. Your personality is '+trait.toLowerCase()+'.','Birth');pendingEvent=null;activePage='life';save(true);render();toast('Your story has begun.')}
function applyJob(name){const job=careers[name];if(!job)return;if(game.age<13||(name==='Knight'&&game.age<18)||(name==='Royal Adviser'&&game.reputation<45)||(name==='Lord / Lady'&&game.reputation<35)||(name==='Noble Steward'&&game.reputation<20)){toast('You do not yet meet the requirements.');return}game.career=name;game.reputation=clamp(game.reputation+2);game.lastAction='You begin a new role: '+name+'.';addLog('New career','You become a '+name+'.','Career');save(true);render();toast('You are now a '+name+'.')}
function romance(){if(game.partner){game.happiness=clamp(game.happiness+8);game.reputation=clamp(game.reputation+1);game.lastAction='You make time for your partner and strengthen your bond.';addLog('A moment together',game.lastAction,'Relationship')}else{const names=['Alys','Edwin','Maren','Thomas','Elin','Hugh','Beatrice','Robin','Cecily','Willem'];game.partner=rand(names);game.happiness=clamp(game.happiness+8);game.reputation=clamp(game.reputation+2);game.lastAction='You meet '+game.partner+' and the two of you begin a relationship.';addLog('A new romance',game.lastAction,'Relationship')}save(true);render();toast(game.lastAction)}
function child(){if(!game.partner||game.age<18||game.children>=8)return;game.children++;game.money=Math.max(0,game.money-8);game.happiness=clamp(game.happiness+5);game.lastAction='You welcome a child into your family. Your legacy grows.';addLog('A child is born',game.lastAction,'Family');save(true);render();toast('Your family grows.')}
function exportBio(){if(!game)return;const textOut='MEDIEVAL LIFE — BIOGRAPHY\n'+game.name+'\nBorn: '+game.year+' · Background: '+game.origin+'\nFinal age: '+game.age+'\nStanding: '+game.rank+'\nCareer: '+game.career+'\nChildren: '+game.children+'\n\n'+game.log.slice().reverse().map(e=>'Age '+e.age+' — '+e.title+'\n'+e.text).join('\n\n');const blob=new Blob([textOut],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(game.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'life')+'-biography.txt';a.click();URL.revokeObjectURL(url);toast('Biography export prepared.')}
function bind(){const c=$('pageContent');c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='startBtn')return startLife();if(b.id==='ageBtn')return advanceYear();if(b.id==='restBtn'){game.health=clamp(game.health+12);game.happiness=clamp(game.happiness+3);game.lastAction='You take a quiet day to rest and recover.';addLog('A day of rest',game.lastAction,'Choice');save(true);render();return toast(game.lastAction)}if(b.id==='studyBtn')return applyAction('study');if(b.id==='romanceBtn')return romance();if(b.id==='childBtn')return child();if(b.id==='exportBtn')return exportBio();if(b.id==='newAfterDeath')return newLife();if(b.dataset.eventChoice!==undefined)return eventChoice(Number(b.dataset.eventChoice));if(b.dataset.job)return applyJob(b.dataset.job);if(b.dataset.choiceType==='action')return applyAction(b.dataset.choice);if(b.dataset.choiceType==='page'){activePage=b.dataset.choice;pendingEvent=null;render();return}});document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;activePage=b.dataset.page;pendingEvent=null;render()});$('saveBtn').addEventListener('click',()=>save());$('exportSaveBtn').addEventListener('click',exportSave);$('importSaveBtn').addEventListener('click',()=>$('importSaveFile').click());$('importSaveFile').addEventListener('change',e=>{importSaveFile(e.target.files&&e.target.files[0]);e.target.value=''});$('restoreBackupBtn').addEventListener('click',restoreBackup);$('newLifeBtn').addEventListener('click',newLife)}
function newLife(){if(game&&game.alive&&!confirm('Start a new life? Your current life will be replaced. Export the biography first if you want to keep it.'))return;pendingEvent=null;game=null;activePage='life';render()}
$('pageContent').addEventListener('click',()=>{});bind();
if(!load()){game=null;activePage='life'}render();
window.__MEDIEVAL_TEST__={getState:()=>game, startTestLife:()=>{game=fresh('Test Rowan','Peasant family','Curious');game.age=20;game.year=1020;game.career='Farmhand';game.money=100;game.alive=true;addLog('Test life','Testing the game.');save(true);render()},advanceYear,render,validSaveData,normaliseSaveData,restoreBackup,importSaveData,save,load};
})();
</script>
